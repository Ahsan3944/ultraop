name: Build EveryMobDropsOP

on:
  push:
    branches:
      - build/every-mob-drops-op-jar
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source container
        uses: actions/checkout@v4

      - name: Reconstruct and validate source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .build/source-*.b64 > /tmp/EveryMobDropsOP-source.b64
          echo "Encoded archive bytes: $(wc -c < /tmp/EveryMobDropsOP-source.b64)"
          base64 --decode /tmp/EveryMobDropsOP-source.b64 > /tmp/EveryMobDropsOP-source.zip
          unzip -t /tmp/EveryMobDropsOP-source.zip
          unzip -q /tmp/EveryMobDropsOP-source.zip -d "$GITHUB_WORKSPACE"
          test -f EveryMobDropsOP/build.gradle
          test -f EveryMobDropsOP/src/main/resources/fabric.mod.json

      - name: Patch source for Minecraft 1.21.11 Mojang mappings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("EveryMobDropsOP/src/main/java/com/ultraop/emdo/EveryMobDropsOP.java")
          s = p.read_text()
          replacements = {
              "import net.minecraft.network.chat.Component;\n": "import net.minecraft.network.chat.Component;\nimport net.minecraft.network.chat.MutableComponent;\n",
              "import net.minecraft.world.level.storage.loot.LootContextParams;": "import net.minecraft.world.level.storage.loot.parameters.LootContextParams;",
              "Items.GOLD_INGOT, Items.QUARTZ, Items.CHAIN, Items.GOLD_NUGGET": "Items.GOLD_INGOT, Items.QUARTZ, Items.IRON_CHAIN, Items.GOLD_NUGGET",
              "killer.getGameProfile().getName()": "killer.getName().getString()",
              "victim.getGameProfile().getName()": "victim.getName().getString()",
              "level.dimension().location()": "level.dimension().identifier()",
              "enchantmentKey.location()": "enchantmentKey.identifier()",
              ".requires(source -> source.hasPermission(2))": ".requires(Commands.hasPermission(Commands.LEVEL_GAMEMASTERS))",
              "context.getParamOrNull(LootContextParams.THIS_ENTITY)": "context.getOptionalParameter(LootContextParams.THIS_ENTITY)",
              "private static Component colored(String text, int rgb, boolean bold) {": "private static MutableComponent colored(String text, int rgb, boolean bold) {",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f"Expected old source token not found: {old}")
              s = s.replace(old, new)
          p.write_text(s)
          print("Applied", len(replacements), "Minecraft 1.21.11 mapping/API fixes.")
          PY

      - name: Fix Mixin package collision
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p EveryMobDropsOP/src/main/java/com/ultraop/emdo/mixin
          mv EveryMobDropsOP/src/main/java/com/ultraop/emdo/ItemEntityMixin.java EveryMobDropsOP/src/main/java/com/ultraop/emdo/mixin/ItemEntityMixin.java
          mv EveryMobDropsOP/src/main/java/com/ultraop/emdo/LivingEntityMixin.java EveryMobDropsOP/src/main/java/com/ultraop/emdo/mixin/LivingEntityMixin.java
          python3 - <<'PY'
          from pathlib import Path
          root = Path("EveryMobDropsOP/src/main/java/com/ultraop/emdo/mixin")
          for name in ("ItemEntityMixin.java", "LivingEntityMixin.java"):
              p = root / name
              s = p.read_text()
              old = "package com.ultraop.emdo;"
              if old not in s:
                  raise SystemExit(f"Expected original package not found in {p}")
              s = s.replace(old, "package com.ultraop.emdo.mixin;", 1)
              if name == "ItemEntityMixin.java":
                  s = s.replace("package com.ultraop.emdo.mixin;", "package com.ultraop.emdo.mixin;\\n\\nimport com.ultraop.emdo.TimedDropManager;", 1)
              p.write_text(s)
          cfg = Path("EveryMobDropsOP/src/main/resources/everymobdropsop.mixins.json")
          s = cfg.read_text()
          old = '"package": "com.ultraop.emdo"'
          if old not in s:
              raise SystemExit("Expected original Mixin package not found in config")
          cfg.write_text(s.replace(old, '"package": "com.ultraop.emdo.mixin"', 1))
          print("Moved Mixin classes into isolated package and updated config.")
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Build mod JAR
        working-directory: EveryMobDropsOP
        run: gradle --no-daemon clean build --stacktrace

      - name: Verify the produced JAR
        shell: bash
        run: |
          set -euo pipefail
          ls -lah EveryMobDropsOP/build/libs
          jarfile="$(find EveryMobDropsOP/build/libs -maxdepth 1 -type f -name 'EveryMobDropsOP-*.jar' ! -name '*sources.jar' | head -n 1)"
          test -n "$jarfile"
          jar tf "$jarfile" | tee /tmp/emdo-jar-contents.txt
          grep -q 'fabric.mod.json' /tmp/emdo-jar-contents.txt
          grep -q 'com/ultraop/emdo/EveryMobDropsOP.class' /tmp/emdo-jar-contents.txt
          grep -q 'com/ultraop/emdo/mixin/ItemEntityMixin.class' /tmp/emdo-jar-contents.txt
          grep -q 'com/ultraop/emdo/mixin/LivingEntityMixin.class' /tmp/emdo-jar-contents.txt
          grep -q 'everymobdropsop.mixins.json' /tmp/emdo-jar-contents.txt

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: EveryMobDropsOP-Minecraft-1.21.11
          path: |
            EveryMobDropsOP/build/libs/EveryMobDropsOP-*.jar
          if-no-files-found: error
          retention-days: 14
